<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
</head>
<body>
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa"/>
        <input type="submit" value="Tìm kiếm"/>
    </form>

    <!--
      Muốn dùng Bing: đổi action thành "https://www.bing.com/search"
      (Bing cũng nhận từ khóa qua tham số "q" nên giữ nguyên name="q").
    -->
</body>
</html>
